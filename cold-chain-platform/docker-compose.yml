services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cold_chain
      POSTGRES_USER: cold_chain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cold_chain}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cold_chain -d cold_chain"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head && (python -m app.backup --quiet || true) && python -m app.seed &&
      if [ \"$${APP_ENV}\" = \"prod\" ] || [ \"$${APP_ENV}\" = \"production\" ];
      then uvicorn app.main:app --host 0.0.0.0 --port 8000;
      else uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload;
      fi"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
